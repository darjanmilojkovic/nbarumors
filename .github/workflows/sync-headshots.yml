# Fetch headshots for players who have gained an NBA id since the last run, and
# re-check every existing one for a photo the NBA has since replaced,
# and commit them next to the manifest that lists them.
#
# This job exists because of an invariant in src/scripts/sync-images.ts: images
# live in public/, the manifest naming them is generated from the files on
# disk, and the two are committed together so "code, manifest and images ship
# in one deploy and cannot disagree". A Vercel cron cannot maintain that -- it
# has no repository to commit to -- and serving from a CDN instead is the
# hotlinking that next.config deliberately forbids. So the automation has to
# live where commits happen.
#
# discover-players fills in new NBA ids nightly and nothing fetched their
# images, so they accumulated until somebody ran the script by hand. Fifteen
# were sitting uncommitted on 9 Sep 2026, which is what prompted this.
name: Sync player headshots

on:
  schedule:
    # Mondays 06:20 UTC. New ids arrive at roughly one a day, so weekly keeps
    # the drift under a handful while keeping deploys rare.
    - cron: "20 6 * * 1"
  workflow_dispatch:

# Never let two runs race for the same push.
concurrency:
  group: sync-headshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # A missing secret FAILS the job, on purpose.
      #
      # This used to skip cleanly so it would not email a failure every Monday.
      # The result was worse: the runs on 14 and 21 Sep went green having done
      # nothing, 37 players accumulated without a photo, and the green tick was
      # the reason nobody looked. A job that cannot do its work has failed, and
      # it should say so.
      - name: Require the database credential
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      # Reads players and teams for their NBA ids. Writes nothing to the
      # database -- an earlier version did, and repointing headshot_url from a
      # laptop took every image on the live site down.
      # --refresh re-checks every player, not just new ids, so a new season's
      # photo -- or a real photo where the NBA first served its grey stand-in --
      # replaces the old file. Unchanged originals write nothing (their md5s are
      # in src/lib/headshot-sources.json), so the commit is only real changes.
      - name: Fetch new and changed headshots and rebuild the manifest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sync:images -- --refresh

      - name: Commit whatever is new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only these paths: nothing else in the tree is this job's business.
          git add public/headshots src/lib/cached-images.ts src/lib/headshot-sources.json
          if git diff --cached --quiet -- public/headshots src/lib/cached-images.ts; then
            echo "no new or changed headshots"
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- public/headshots | wc -l)
          updated=$(git diff --cached --name-only --diff-filter=M -- public/headshots | wc -l)
          git commit -m "Headshots from the weekly sync: ${added} new, ${updated} updated"
          git push
